name: Daily Solution Update

# Pulls the day's Wordle and Connections answers into the mod, bumps the version,
# commits to main, then hands off to the toolkit's Create Release workflow so the
# dev Workshop item picks the update up.
#
# TIMING: NYT puzzles roll over at midnight US Eastern. The 01:05 UTC schedule
# below fires ~3 hours BEFORE that, so tools/update_solutions.py polls until the
# new day is published (see WAIT_MINUTES). Moving the cron to "5 5 * * *"
# (01:05 ET during EDT) would let the run start with both puzzles already live
# and drop the wait to zero.

on:
  schedule:
    - cron: "5 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: 'Puzzle date (YYYY-MM-DD). Blank uses the run date in UTC.'
        required: false
        default: ''
        type: string
      wait-minutes:
        description: 'Minutes to poll for a puzzle that has not gone live yet. 0 fails fast.'
        required: false
        default: '0'
        type: string
      trigger-release:
        description: 'Trigger cmt-create-release.yml when the update is committed'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: solution-update-${{ github.repository }}
  cancel-in-progress: false

env:
  # Scheduled runs start before the puzzles exist, so they have to wait them out.
  # 210 min covers 01:05 UTC -> just past midnight US Eastern in either DST offset.
  WAIT_MINUTES: ${{ inputs.wait-minutes || '210' }}

jobs:
  update-solutions:
    name: "Update Solutions"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      version: ${{ steps.solutions.outputs.version }}
      date: ${{ steps.solutions.outputs.date }}
      changed: ${{ steps.solutions.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

        # Fetches the Wordle answer from the NYT puzzle service and the Connections
        # groups from Eyefyre/NYT-Connections-Answers, rewrites
        # main_menu/localization/english/wu_solutions_l_english.yml, and sets the
        # metadata.json version to YY.MMDD for the puzzle date.
      - name: Fetch Solutions and Update the Mod
        id: solutions
        run: |
          python3 tools/update_solutions.py \
            --date "${{ inputs.date }}" \
            --wait-minutes "$WAIT_MINUTES" \
            --poll-seconds 300

      - name: Commit to main
        id: commit
        if: ${{ steps.solutions.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.solutions.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .metadata/metadata.json main_menu/localization/english/wu_solutions_l_english.yml
          if git diff --cached --quiet; then
            echo "Nothing staged; skipping commit."
            exit 0
          fi
          git commit -m "$VERSION" -m "Updated for the new day's solutions"
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            echo "### Solution update"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Puzzle date | \`${{ steps.solutions.outputs.date }}\` |"
            echo "| Version | \`${{ steps.solutions.outputs.version }}\` |"
            echo "| Wordle | \`${{ steps.solutions.outputs.wordle }}\` |"
            echo "| Committed | \`${{ steps.solutions.outputs.changed }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-release:
    name: "Trigger Create Release"
    needs: update-solutions
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.trigger-release }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
        # workflow_dispatch is one of the few events GITHUB_TOKEN is allowed to
        # raise, so this starts a real run of the toolkit's release workflow.
      - name: Dispatch cmt-create-release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.update-solutions.outputs.version }}
        run: |
          gh workflow run cmt-create-release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f channel=dev \
            -f publish=true \
            -f upload-workshop-description=false \
            -f upload-change-notes=false \
            -f upload-submods=false
          echo "Dispatched Create Release (channel: dev) for $VERSION." >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/workflows/cmt-create-release.yml" >> "$GITHUB_STEP_SUMMARY"
