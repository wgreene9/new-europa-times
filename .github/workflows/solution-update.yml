name: Daily Solution Update

# Pulls the day's Wordle and Connections answers into the mod, bumps the version,
# commits to main, then hands off to the toolkit's Create Release workflow so the
# release Workshop item picks the update up.
#
# Both puzzles come from the NYT service keyed by print date, and both are
# populated well ahead of the midnight US Eastern rollover, so a run can ask for
# its own UTC date and get an answer straight away.
#
# The on-time daily run is fired by an external cron (cron-job.org) POSTing to
# this workflow's dispatch endpoint, because GitHub's own scheduler queues
# scheduled runs and was delivering them hours late. The schedule below is only
# a backstop for days when that dispatch does not arrive.

on:
  schedule:
    # Backstop only. The on-time run arrives by workflow_dispatch from
    # cron-job.org at 01:00 UTC; this catches the day if that never fires.
    - cron: "5 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: 'Puzzle date (YYYY-MM-DD). Blank uses the run date in UTC.'
        required: false
        default: ''
        type: string
      trigger-release:
        description: 'Trigger cmt-create-release.yml when the update is committed'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: solution-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-solutions:
    name: "Update Solutions"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.solutions.outputs.version }}
      date: ${{ steps.solutions.outputs.date }}
      changed: ${{ steps.solutions.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

        # Fetches the Wordle answer and the Connections categories from the NYT
        # puzzle service, rewrites the solutions localization file and the
        # wordle_true_* variables in the scripted effect, sets the metadata.json
        # version to YY.MMDD, and prepends a change-notes entry for that version.
      - name: Fetch Solutions and Update the Mod
        id: solutions
        run: python3 tools/update_solutions.py --date "${{ inputs.date }}"

      - name: Commit to main
        id: commit
        if: ${{ steps.solutions.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.solutions.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .metadata/metadata.json \
            assets/workshop/change-notes.bbcode \
            in_game/common/scripted_effects/cxn_fetch_id.txt \
            in_game/common/scripted_effects/wordle_fetch_true_solution.txt \
            main_menu/localization/english/wu_solutions_l_english.yml
          if git diff --cached --quiet; then
            echo "Nothing staged; skipping commit."
            exit 0
          fi
          git commit -m "$VERSION" -m "Updated for the new day's solutions"
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            echo "### Solution update"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Puzzle date | \`${{ steps.solutions.outputs.date }}\` |"
            echo "| Version | \`${{ steps.solutions.outputs.version }}\` |"
            echo "| Wordle | \`${{ steps.solutions.outputs.wordle }}\` |"
            echo "| Committed | \`${{ steps.solutions.outputs.changed }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-release:
    name: "Trigger Create Release"
    needs: update-solutions
    # Only publish when the day's content actually changed, so the backstop
    # run (or a manual re-run) does not push a duplicate Workshop upload.
    if: ${{ needs.update-solutions.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.trigger-release) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
        # workflow_dispatch is one of the few events GITHUB_TOKEN is allowed to
        # raise, so this starts a real run of the toolkit's release workflow.
      - name: Dispatch cmt-create-release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.update-solutions.outputs.version }}
        run: |
          gh workflow run cmt-create-release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f channel=release \
            -f publish=true \
            -f upload-workshop-description=false \
            -f upload-change-notes=true \
            -f upload-submods=false
          echo "Dispatched Create Release (channel: release) for $VERSION." >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/workflows/cmt-create-release.yml" >> "$GITHUB_STEP_SUMMARY"
